[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binggupack"
version = "1.16.0"   # v1.16.0 — 외부 리뷰 5건 정리(PII scan 버그·툴체인 점진 도입·브랜드 통일). version SSOT = binggupack/__about__.py.
description = "BingguPack — local-first, evidence-backed memory/context pack framework with an installable Claude Code MCP server (stdio JSON-RPC). Python stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BingguPack contributors" }]
keywords = ["mcp", "claude-code", "local-first", "ontology", "context-packs", "agi-memory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = []   # 외부 의존성 0 (stdlib only). 선택: rapidfuzz(매칭 향상)·ollama/bge-m3(semantic).

[project.optional-dependencies]
# 2차 라인 검색 그물 폴백. 미설치여도 SearXNG(도커)·DDG(stdlib)로 discover 동작 — 견고성 보강용.
#   pip install "binggupack[search]"
search = ["ddgs>=9"]

[project.urls]
Homepage = "https://github.com/darkjokee-arch/binggupack"
Release = "https://github.com/darkjokee-arch/binggupack/releases/tag/v1.16.0"

[project.scripts]
# PyPI 설치 후 바로 쓰는 공개 CLI. clone 사용자는 기존 `python binggu.py ...` 그대로 동작한다.
binggu = "binggu:main"
binggupack = "binggu:main"
binggu-interactive-save = "binggupack.cli.interactive_save:main"

[tool.setuptools]
py-modules = ["binggu"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["binggupack*", "scripts", "hooks"]   # scripts/hooks 는 CLI 호환용 번들

[tool.setuptools.package-data]
scripts = ["hybrid_agi/*.py", "hybrid_agi/README.md"]
hooks = ["settings.snippet.json"]

# 설치/검증:
#   pip install binggupack
#   binggu start
#   python -m binggupack doctor
#
# clone 직후, 패키지 설치 없이도 동작:
#   python scripts/smoke_test.py --home ./_binggu_test_home
#   python scripts/install_claude_mcp.py --sandbox --apply
# 서버 직접 실행(설정 등록은 owner):
#   python scripts/openbinggu_mcp_server.py --serve <REPO_ROOT>

# ── 표준 개발 툴체인 (점진 도입) ─────────────────────────────────────────────
# 거대 기존 코드(scripts/ 155개·hybrid_agi/·hosted/·_*)는 제외하고 신규 binggupack/ 패키지만
# 보수적으로 린트/타입체크한다. 기존 자체 selftest 게이트(scripts/binggu_publish_run_all_selftests.py)는
# 그대로 유지 — pytest 가 scripts 를 강제 수집하지 않도록 norecursedirs 로 제외한다.
#   pip install -r requirements/dev.txt
[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["scripts", "hybrid_agi", "_*", "hosted"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]   # 라인 길이는 경고만(점진 도입).

[tool.ruff.lint.per-file-ignores]
# strangler 이관 byte-identical impl — 원본 스타일(E702 세미콜론 다중문·E741 짧은 변수 l) 보존.
# incoming_loader 는 자체 selftest 부재 → byte-identical 이 유일한 동등성 보증이라 스타일 변경 불가.
"binggupack/pack/incoming_loader.py" = ["E702", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["scripts.*", "hybrid_agi.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-q"
norecursedirs = ["scripts", "hybrid_agi", "_*", "hosted", ".git"]
