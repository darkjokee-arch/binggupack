[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binggupack"
version = "1.12.0"   # v1.12.0 Personal speaker axis (화자 축 owner/ai + 페어 동사형 엣지 + 양방향 신뢰도). main 반영·운영 ledger 마이그레이션 무손상.
description = "BingguPack — local-first, evidence-backed memory/context pack framework with an installable Claude Code MCP server (stdio JSON-RPC). Python stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BingguPack contributors" }]
keywords = ["mcp", "claude-code", "local-first", "ontology", "context-packs", "agi-memory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = []   # 외부 의존성 0 (stdlib only). 선택: rapidfuzz(매칭 향상)·ollama/bge-m3(semantic).

[project.urls]
Homepage = "https://github.com/darkjokee-arch/binggupack"
Release = "https://github.com/darkjokee-arch/binggupack/releases/tag/v1.10.0"

[project.scripts]
# v1.11.0 groundwork: 패키지로 노출되는 보조 진입점. 기존 `python binggu.py ...` /
# `python scripts/smoke_test.py` 는 backward-compatible 하게 그대로 유지된다.
binggu-interactive-save = "binggupack.cli.interactive_save:main"

[tool.setuptools.packages.find]
include = ["binggupack*"]   # flat-layout 의 top-level binggu.py / scripts 와 충돌 회피

# 설치/검증 (clone 직후, 패키지 설치 없이도 동작):
#   python scripts/smoke_test.py --home ./_binggu_test_home
#   python scripts/install_claude_mcp.py --sandbox --apply
# 서버 직접 실행(설정 등록은 owner):
#   python scripts/openbinggu_mcp_server.py --serve <REPO_ROOT>
