[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binggupack"
version = "1.15.0"   # v1.15.0 — v1.14.0 위 owner 발화 a0 형식게이트 면제(speaker=owner 구어체 원문 보존·안전게이트 불변).
description = "BingguPack — local-first, evidence-backed memory/context pack framework with an installable Claude Code MCP server (stdio JSON-RPC). Python stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BingguPack contributors" }]
keywords = ["mcp", "claude-code", "local-first", "ontology", "context-packs", "agi-memory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
]
dependencies = []   # 외부 의존성 0 (stdlib only). 선택: rapidfuzz(매칭 향상)·ollama/bge-m3(semantic).

[project.optional-dependencies]
# 2차 라인 검색 그물 폴백. 미설치여도 SearXNG(도커)·DDG(stdlib)로 discover 동작 — 견고성 보강용.
#   pip install "binggupack[search]"
search = ["ddgs>=9"]

[project.urls]
Homepage = "https://github.com/darkjokee-arch/binggupack"
Release = "https://github.com/darkjokee-arch/binggupack/releases/tag/v1.15.0"

[project.scripts]
# PyPI 설치 후 바로 쓰는 공개 CLI. clone 사용자는 기존 `python binggu.py ...` 그대로 동작한다.
binggu = "binggu:main"
binggupack = "binggu:main"
binggu-interactive-save = "binggupack.cli.interactive_save:main"

[tool.setuptools]
py-modules = ["binggu"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["binggupack*", "scripts", "hooks"]   # scripts/hooks 는 CLI 호환용 번들

[tool.setuptools.package-data]
scripts = ["hybrid_agi/*.py", "hybrid_agi/README.md"]
hooks = ["settings.snippet.json"]

# 설치/검증:
#   pip install binggupack
#   binggu start
#   python -m binggupack doctor
#
# clone 직후, 패키지 설치 없이도 동작:
#   python scripts/smoke_test.py --home ./_binggu_test_home
#   python scripts/install_claude_mcp.py --sandbox --apply
# 서버 직접 실행(설정 등록은 owner):
#   python scripts/openbinggu_mcp_server.py --serve <REPO_ROOT>
