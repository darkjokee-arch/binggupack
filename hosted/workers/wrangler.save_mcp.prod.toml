# save-intent MCP 어댑터 worker — ChatGPT 저장 채널(SAVE n 승인분만 inbox 적재 → PC pull).
# 배포: `binggu onboard --apply --deploy` 가 본인 Cloudflare 계정에 배포(clone 필요·hosted/ 소스).
# read 라인·v2 라인과 name 완전 분리 — 오배포·삭제 모두 격리.
# 기본 = inbox 잠김(fail-closed). Workers Logs/observability 켜지 말 것(경로키 노출 방지).
name = "binggupack-save-intent-mcp"
main = "src/index.save_mcp.ts"
compatibility_date = "2025-05-01"

[[durable_objects.bindings]]
name = "INBOX"
class_name = "IntentInbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IntentInbox"]
