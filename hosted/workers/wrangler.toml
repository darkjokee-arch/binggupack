name = "binggupack-workers-port-local"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# P3(2026-06-15): conversation_capture_preview semantic 도장 일원화 배포.
# 경로 토큰은 wrangler secret 으로 기배포 유지. SEMANTIC_LABEL_ENABLED 미설정이면 OFF(기존 동작 보존).
# AI 바인딩만 추가 — opt-in OFF 배포 시 실호출 0.

[ai]
binding = "AI"

# P3 활성(2026-06-15 owner "라이브배포 시작"): semantic 도장 ON. 실패 시 RULES→no_suggestion fallback.
[vars]
SEMANTIC_LABEL_ENABLED = "1"

# save_intent(write) 도구용 — save worker(binggupack-save-intent-mcp)의 IntentInbox 를 cross-script 공유.
# 소유·migration 은 save worker 가 보유(여기선 참조만) → 적재는 기존 inbox→PC pull 파이프라인 그대로 재사용.
[[durable_objects.bindings]]
name = "INBOX"
class_name = "IntentInbox"
script_name = "binggupack-save-intent-mcp"
