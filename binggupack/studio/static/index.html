<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Binggu Studio Preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <span class="title">BingguPack</span>
      <span class="badge badge-ro" title="이 화면은 읽기 전용입니다">Read-only</span>
    </div>
    <nav class="mainnav" id="mainnav" aria-label="주 메뉴">
      <button type="button" class="navbtn" data-view="home" aria-current="page">Home</button>
      <button type="button" class="navbtn" data-view="inbox">Inbox</button>
      <button type="button" class="navbtn" data-view="memories">Memories</button>
      <button type="button" class="navbtn" data-view="approvals">Approvals</button>
    </nav>
    <div class="status" id="status-strip" aria-live="polite">
      <span class="chip" id="chip-integrity">장부 —</span>
      <span class="chip" id="chip-capture">capture —</span>
      <span class="chip" id="chip-provider">provider —</span>
      <span class="chip chip-time" id="chip-updated">갱신 —</span>
    </div>
    <div class="controls">
      <button type="button" id="btn-refresh" class="btn">새로고침</button>
      <button type="button" id="btn-auto" class="btn btn-ghost" aria-pressed="true">자동 갱신: 켬</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p class="notice" id="global-error" role="alert" hidden></p>

    <!-- HOME -->
    <section class="view panel" id="view-home" aria-labelledby="home-h">
      <h2 id="home-h">Home</h2>
      <div class="cards" id="home-cards"><p class="loading">불러오는 중…</p></div>
    </section>

    <!-- INBOX -->
    <section class="view panel" id="view-inbox" aria-labelledby="inbox-h" hidden>
      <h2 id="inbox-h">검토함 (Inbox)</h2>
      <nav class="tabs" id="inbox-tabs" role="tablist" aria-label="검토함 탭"></nav>
      <div id="inbox-body"><p class="loading">불러오는 중…</p></div>
    </section>

    <!-- MEMORIES -->
    <section class="view panel" id="view-memories" aria-labelledby="mem-h" hidden>
      <h2 id="mem-h">기억 (Memories)</h2>
      <p class="lexnote" id="mem-lexnote"></p>
      <form class="memtools" id="mem-form" role="search">
        <input type="search" id="mem-q" name="q" placeholder="기억 검색 (문장 포함)" autocomplete="off" aria-label="기억 검색">
        <select id="mem-state" aria-label="상태 필터">
          <option value="active">활성</option>
          <option value="deprecated">폐기</option>
          <option value="all">전체</option>
        </select>
        <select id="mem-type" aria-label="종류 필터">
          <option value="">종류 전체</option>
          <option value="judgment">judgment</option>
          <option value="state">state</option>
          <option value="evidence">evidence</option>
          <option value="concept">concept</option>
          <option value="doc">doc</option>
        </select>
        <input type="text" id="mem-subtype" placeholder="subtype" autocomplete="off" aria-label="subtype 필터">
        <button type="submit" class="btn" id="mem-search">목록</button>
        <button type="button" class="btn btn-ghost" id="mem-recall">회상</button>
      </form>
      <div class="memcount" id="mem-count" aria-live="polite"></div>
      <div class="memlayout">
        <div class="memlist" id="mem-list"><p class="empty">검색어를 입력하거나 목록을 누르세요.</p></div>
        <aside class="memdetail" id="mem-detail" aria-live="polite" hidden></aside>
      </div>
      <div class="mempager" id="mem-pager" hidden>
        <button type="button" class="btn btn-ghost" id="mem-more">더 보기</button>
      </div>
    </section>

    <!-- APPROVALS -->
    <section class="view panel" id="view-approvals" aria-labelledby="appr-h" hidden>
      <h2 id="appr-h">승인 (Approvals)</h2>
      <p class="lexnote">Studio 는 승인을 실행하지 않습니다. 아래 명령을 복사해 owner 가 별도 로컬 터미널에서 직접 실행하세요.</p>
      <div class="cards" id="appr-cards"></div>
      <form class="memtools" id="appr-form" role="search">
        <select id="appr-state" aria-label="상태 필터">
          <option value="all">전체</option>
          <option value="pending">대기(pending)</option>
          <option value="approved">승인됨(approved)</option>
          <option value="consuming">소비중(consuming)</option>
          <option value="consumed">완료(consumed)</option>
          <option value="rejected">거절(rejected)</option>
          <option value="revoked">취소(revoked)</option>
          <option value="expired">만료(expired)</option>
        </select>
        <input type="text" id="appr-op" placeholder="operation" autocomplete="off" aria-label="operation 필터">
        <button type="submit" class="btn" id="appr-search">조회</button>
      </form>
      <div class="memcount" id="appr-count" aria-live="polite"></div>
      <div class="memlayout">
        <div class="memlist" id="appr-list"><p class="empty">조회를 누르세요.</p></div>
        <aside class="memdetail" id="appr-detail" aria-live="polite" hidden></aside>
      </div>
      <div class="mempager" id="appr-pager" hidden>
        <button type="button" class="btn btn-ghost" id="appr-more">더 보기</button>
      </div>
    </section>

    <footer class="foot">
      <span id="foot-mode">read-only preview</span>
      <span class="dot">·</span>
      <span>모든 저장·승인은 기존 CLI 와 owner 승인 경계를 사용합니다</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="static/app.js"></script>
</body>
</html>
