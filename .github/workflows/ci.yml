name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # windows 러너 cp1252 콘솔 한국어 출력 UnicodeEncodeError 방지 (posix는 무해)

jobs:
  typecheck-workers:
    # hosted/workers TS 11파일 strict 타입검사 — 로컬 tsc 0건 확인 후 게이트화(2026-07-05)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install (hosted/workers devDeps · lockfile 있으면 npm ci)
        working-directory: hosted/workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json — npm install fallback (lockfile 커밋 권장)"
            npm install
          fi
      - name: tsc --noEmit (strict)
        working-directory: hosted/workers
        run: npx tsc --noEmit

  selftest:
    # cross-platform 정책(scripts/binggu_platform.py) 실기기 검증 — 실제 ubuntu/macos/windows 러너에서 GATE=GO.
    # 선언 지원범위(requires-python>=3.10) 증명: Linux 에서 3.10/3.12/3.13 버전 매트릭스 + macOS/Windows 대표버전 smoke.
    strategy:
      fail-fast: false  # 한 조합이 깨져도 나머지 결과를 끝까지 본다
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Version SSOT consistency selftest (3/3, GATE=GO — pyproject==__about__)
        run: python scripts/version_consistency_selftest.py

      - name: Ruff static gate (binggupack/ F-rules 0 — 7/3 달성 상태 고정)
        run: |
          pip install -r requirements/dev.txt
          python -m ruff check binggupack/ scripts/ --select F

      - name: Anywhere vendor sync drift gate (vendored read core == source)
        run: python scripts/sync_anywhere_vendor.py --check

      - name: Anywhere targeted tests (snapshot/service/upload · synthetic)
        run: |
          pip install -r requirements/dev.txt
          python -m pytest tests/test_anywhere_snapshot.py tests/test_anywhere_service.py tests/test_anywhere_upload.py -q

      - name: Cross-platform policy selftest (40/40, GATE=GO)
        run: python scripts/binggu_platform_selftest.py

      - name: binggu core selftest (27/27, GATE=GO)
        run: python binggu.py --selftest

      - name: Local Fresh Index — selftest + full pytest (신규 기능 · 3.14 포함)
        run: |
          pip install -r requirements/dev.txt
          python -m binggupack.pack.fresh_index --selftest
          python -m pytest tests/test_fresh_index.py -q

      - name: Doctor selftest (12/12, GATE=GO required)
        run: python scripts/openbinggu_doctor.py --selftest

      - name: Autopush double-gate selftest (18/18, GATE=GO — npx/--remote 실경로)
        run: python scripts/binggu_publish_autopush.py --selftest

      - name: Cloud setup selftest (38/38, GATE=GO — wrangler npx 폴백)
        run: python scripts/binggu_setup_cloud.py --selftest

      - name: Publish pipeline regression (P1~cloud_pack, REGRESSION=GO required)
        run: python scripts/binggu_publish_run_all_selftests.py

      - name: End-to-end lifecycle (real CLI init->preview->save->list->deprecate, 10/10)
        run: python scripts/binggu_e2e_lifecycle_selftest.py

      - name: Demo regression (60초 데모 · 격리·오프라인·승인분만 저장·운영 장부 미접촉)
        run: |
          pip install -r requirements/dev.txt
          python -m pytest tests/test_demo.py -q

      - name: Semantic seed SSOT (issue #52 · canonical·byte-identity·hosted seed_hash · Windows LF 결정성)
        # selftest 잡은 Windows 포함 매트릭스 — Windows checkout(autocrlf) 에서도 .gitattributes eol=lf
        # 로 working tree 가 LF 인지, source↔fixture byte-identical·source canonical·hosted seed_hash
        # 정합인지 실측(sync --check 는 CR 바이트·BOM·final-LF 도 검사). write mode 는 CI 에서 실행 0.
        run: |
          pip install -r requirements/dev.txt
          python scripts/sync_semantic_seed.py --check --check-hosted
          python -m pytest tests/test_semantic_seed_resolver.py tests/test_semantic_seed_sync.py -q

      - name: Public tree secret/PII scan (verdict=CLEAN required)
        run: python scripts/openbinggu_public_tree_scan.py --tree . --public

  wheel-selfcontained:
    # wheel 자족성 게이트(2026-07-13) — 설치본이 repo checkout 없이 자족하는지 실측.
    # ① 클린 venv 설치본 `binggu --selftest`(과거: tests/ 미동봉 ModuleNotFoundError)
    # ② 전 모듈(binggu·binggupack.*·scripts.*) fresh-subprocess import sweep — 저장소 밖 cwd 로
    #    repo sys.path 우연 통과 차단. 경량 단일 잡(매트릭스 불변).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"

      - name: Clean venv install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet "$RUNNER_TEMP"/dist/binggupack-*.whl

      - name: Installed binggu --selftest (repo 밖 cwd · GATE=GO)
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/venv/bin/binggu" --selftest'

      - name: Wheel import sweep (전 모듈 fresh subprocess · 실패 0)
        run: |
          cp scripts/wheel_import_sweep.py "$RUNNER_TEMP/wheel_import_sweep.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" wheel_import_sweep.py

      - name: Semantic seed wheel resource == package data (issue #52 · canonical LF)
        # wheel archive 내부 seed bytes == fresh-installed importlib.resources == repo package data.
        # fixture fallback 이 아니라 배포 정본 package resource 를 repo 밖 fresh python 으로 검증.
        run: python scripts/wheel_semantic_seed_check.py "$RUNNER_TEMP"/dist/binggupack-*.whl "$RUNNER_TEMP/venv/bin/python"

  typecheck-python:
    # mypy 정적 타입 게이트(2026-07-13) — binggupack + binggu.py 회귀 방지. 로컬 0 errors 후 게이트화.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev toolchain (requirements/dev.txt · mypy 포함)
        run: pip install -r requirements/dev.txt

      - name: mypy (binggupack + binggu.py · 0 errors required)
        run: python -m mypy binggupack binggu.py

  npm-audit:
    # 의존성 취약점 참고 스캔(2026-07-13) — 별도 잡 + continue-on-error 로 머지 게이트와 분리한다.
    # 상류 advisory 로 무관 PR 이 red 되어 비결정 머지 차단되는 것 방지(게이팅 아님 · 신호만).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: npm audit (hosted/workers · high 이상 · 비게이팅)
        working-directory: hosted/workers
        run: npm audit --audit-level=high || true

  mgb-benchmark:
    # Memory Governance Benchmark v0.1 (2026-07-15) — black-box 공개 CLI 프로필.
    # benchmark 자체 unit tests + toy(conforming/failing) 이식성 + BingguPack 12 시나리오
    # (MGB-10 UNSUPPORTED · 운영 ledger 불변). 코어 무변경 · 벤치마크는 공개 CLI 만 관찰.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dev toolchain (requirements/dev.txt)
        run: pip install -r requirements/dev.txt
      - name: MGB benchmark tests (result model · toy 이식성 · runner 독립판정 · BingguPack 12)
        run: python -m pytest benchmark/tests/ -q
