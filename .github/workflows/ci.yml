name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"  # windows 러너 cp1252 콘솔 한국어 출력 UnicodeEncodeError 방지 (posix는 무해)

jobs:
  typecheck-workers:
    # hosted/workers TS 11파일 strict 타입검사 — 로컬 tsc 0건 확인 후 게이트화(2026-07-05)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosted/workers/package-lock.json
      - name: Install (hosted/workers devDeps · lockfile 있으면 npm ci)
        working-directory: hosted/workers
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "no package-lock.json — npm install fallback (lockfile 커밋 권장)"
            npm install
          fi
      - name: tsc --noEmit (strict)
        working-directory: hosted/workers
        run: npx tsc --noEmit

  selftest:
    # cross-platform 정책(scripts/binggu_platform.py) 실기기 검증 — 실제 ubuntu/macos/windows 러너에서 GATE=GO.
    # 선언 지원범위(requires-python>=3.10) 증명: Linux 에서 3.10/3.12/3.13 버전 매트릭스 + macOS/Windows 대표버전 smoke.
    strategy:
      fail-fast: false  # 한 조합이 깨져도 나머지 결과를 끝까지 본다
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dev toolchain (requirements/dev.txt · leg당 1회 통합)
        # 과거: ruff/pytest 스텝마다 pip install 반복(leg당 5회). setup-python cache:pip 와 함께
        # leg당 1회로 통합 — 후속 스텝은 이미 설치된 툴체인을 재사용한다.
        run: pip install -r requirements/dev.txt

      - name: Version SSOT consistency selftest (3/3, GATE=GO — pyproject==__about__)
        run: python scripts/version_consistency_selftest.py

      - name: Ruff static gate (binggupack/ F-rules 0 — 7/3 달성 상태 고정)
        run: python -m ruff check binggupack/ scripts/ --select F

      - name: Anywhere vendor sync drift gate (vendored read core == source)
        run: python scripts/sync_anywhere_vendor.py --check

      - name: Anywhere targeted tests (snapshot/service/upload · synthetic)
        run: python -m pytest tests/test_anywhere_snapshot.py tests/test_anywhere_service.py tests/test_anywhere_upload.py -q -n auto

      - name: Cross-platform policy selftest (40/40, GATE=GO)
        run: python scripts/binggu_platform_selftest.py

      - name: binggu core selftest (27/27, GATE=GO)
        run: python binggu.py --selftest

      - name: Protected Writer L2 signing selftest (Ed25519 순수 stdlib KAT + keychain backend + fail-closed)
        # 순수 stdlib(런타임 의존 0)·크로스플랫폼: win DPAPI 실경로·mac security·headless linux L0 fail-closed.
        # negative KAT(변조/malleable/전부-0/wrong pk) 전부 reject·fail-open 0. 운영 keychain 미접촉(fake seam).
        run: |
          python -m binggupack.safety.signing_provider --selftest
          python -m binggupack.safety.keychain_backend --selftest
          python scripts/check_ed25519_vectors.py

      - name: Local Fresh Index — selftest + full pytest (신규 기능 · 3.14 포함)
        run: |
          python -m binggupack.pack.fresh_index --selftest
          python -m pytest tests/test_fresh_index.py -q -n auto

      - name: Doctor selftest (12/12, GATE=GO required)
        run: python scripts/openbinggu_doctor.py --selftest

      - name: Cloud setup selftest (38/38, GATE=GO — wrangler npx 폴백)
        run: python scripts/binggu_setup_cloud.py --selftest

      # Autopush(18/18) 와 Public tree scan(verdict=CLEAN) 은 아래 run_all 회귀 묶음
      # (binggu_publish_run_all_selftests.py 의 "autopush" · "tree scan" GATES)이 leg 마다 1회 실행하므로
      # 별도 직접 스텝을 제거해 leg당 2중 실행을 1회로 정리했다(커버리지 동일 · 중복만 제거).
      - name: Publish pipeline regression (P1~cloud_pack + autopush + tree scan, REGRESSION=GO required)
        run: python scripts/binggu_publish_run_all_selftests.py

      - name: End-to-end lifecycle (real CLI init->preview->save->list->deprecate, 10/10)
        run: python scripts/binggu_e2e_lifecycle_selftest.py

      - name: Demo regression (60초 데모 · 격리·오프라인·승인분만 저장·운영 장부 미접촉)
        run: python -m pytest tests/test_demo.py -q -n auto

      - name: Semantic seed SSOT (issue #52 · canonical·byte-identity·hosted seed_hash · Windows LF 결정성)
        # selftest 잡은 Windows 포함 매트릭스 — Windows checkout(autocrlf) 에서도 .gitattributes eol=lf
        # 로 working tree 가 LF 인지, source↔fixture byte-identical·source canonical·hosted seed_hash
        # 정합인지 실측(sync --check 는 CR 바이트·BOM·final-LF 도 검사). write mode 는 CI 에서 실행 0.
        run: |
          python scripts/sync_semantic_seed.py --check --check-hosted
          python -m pytest tests/test_semantic_seed_resolver.py tests/test_semantic_seed_sync.py -q -n auto

  wheel-selfcontained:
    # wheel 자족성 게이트(2026-07-13) — 설치본이 repo checkout 없이 자족하는지 실측.
    # ① 클린 venv 설치본 `python -m binggupack --selftest`(과거: tests/ 미동봉 ModuleNotFoundError)
    # ② 전 모듈(binggu·binggupack.*·scripts.*) fresh-subprocess import sweep — 저장소 밖 cwd 로
    #    repo sys.path 우연 통과 차단.
    # 3-OS 매트릭스(2026-07-17): venv bin 경로만 OS별($VBIN: posix=bin / windows=Scripts),
    # 전 스텝 shell=bash(windows=git-bash) 통일 + `python -m binggupack`(binggu.exe 경로 이슈 회피)로 windows 포함.
    strategy:
      fail-fast: false  # 한 OS가 깨져도 나머지 OS 결과를 끝까지 본다
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows 도 git-bash 로 통일 — 경로/스텝 단일화
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: venv bin 경로 (OS별 · posix=bin / windows=Scripts)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "VBIN=$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_ENV"
          else echo "VBIN=$RUNNER_TEMP/venv/bin" >> "$GITHUB_ENV"; fi

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"

      - name: Clean venv install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$VBIN/python" -m pip install --quiet "$RUNNER_TEMP"/dist/binggupack-*.whl

      - name: Installed --selftest (repo 밖 cwd · GATE=GO)
        working-directory: ${{ runner.temp }}
        run: '"$VBIN/python" -m binggupack --selftest'

      - name: Wheel import sweep (전 모듈 fresh subprocess · 실패 0)
        run: |
          cp scripts/wheel_import_sweep.py "$RUNNER_TEMP/wheel_import_sweep.py"
          cd "$RUNNER_TEMP"
          "$VBIN/python" wheel_import_sweep.py

      - name: Semantic seed wheel resource == package data (issue #52 · canonical LF)
        # wheel archive 내부 seed bytes == fresh-installed importlib.resources == repo package data.
        # fixture fallback 이 아니라 배포 정본 package resource 를 repo 밖 fresh python 으로 검증.
        run: python scripts/wheel_semantic_seed_check.py "$RUNNER_TEMP"/dist/binggupack-*.whl "$VBIN/python"

  typecheck-python:
    # mypy 정적 타입 게이트(2026-07-13) — binggupack + binggu.py 회귀 방지. 로컬 0 errors 후 게이트화.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dev toolchain (requirements/dev.txt · mypy 포함)
        run: pip install -r requirements/dev.txt

      - name: mypy (binggupack + binggu.py · 0 errors required)
        run: python -m mypy binggupack binggu.py

  npm-audit:
    # 의존성 취약점 참고 스캔(2026-07-13) — 별도 잡 + continue-on-error 로 머지 게이트와 분리한다.
    # 상류 advisory 로 무관 PR 이 red 되어 비결정 머지 차단되는 것 방지(게이팅 아님 · 신호만).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hosted/workers/package-lock.json
      - name: npm audit (hosted/workers · high 이상 · 비게이팅)
        working-directory: hosted/workers
        run: npm audit --audit-level=high || true

  mgb-benchmark:
    # Memory Governance Benchmark v0.1 (2026-07-15) — black-box 공개 CLI 프로필.
    # benchmark 자체 unit tests + toy(conforming/failing) 이식성 + BingguPack 12 시나리오
    # (MGB-10 UNSUPPORTED · 운영 ledger 불변). 코어 무변경 · 벤치마크는 공개 CLI 만 관찰.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install dev toolchain (requirements/dev.txt)
        run: pip install -r requirements/dev.txt
      - name: Memory PR KAT drift gate (canonicalization 순수함수 재계산 == vectors/kat · exit0=GO)
        run: python docs/memory-pr/tools/check_vectors.py
      - name: MGB benchmark tests (result model · toy 이식성 · runner 독립판정 · BingguPack 12)
        run: python -m pytest benchmark/tests/ -q -n auto

  ci-gate:
    # 단일 게이트 join job (2026-07-17) — branch protection 이 매트릭스 파생 leg 이름
    # (selftest 7leg · wheel 3leg 등)을 required 로 직접 지목하면, 매트릭스가 바뀔 때마다
    # required check 이름이 갈려 branch protection 이 BLOCKED 된다(7/17 wheel 매트릭스화 사고).
    # 게이팅을 이 한 job 으로 수렴 — branch protection 은 `ci-gate` 1개만 required 로 두면 된다.
    #
    # ★ 게이팅 규칙: needs 에 나열된 게이팅 job 이 전부 result=='success' 여야만 통과한다
    #   (skipped/cancelled/failure = fail — fail-open 0, 정확일치). 아래 needs 목록에서 job 을
    #   빼는 diff = "게이팅 완화"이므로 owner 리뷰 필수. 신규 게이팅 job 추가 시 반드시 needs 에도
    #   넣어야 한다(누락 시 그 job 은 게이트되지 않고 조용히 통과 = silent fail-open).
    #   npm-audit 는 continue-on-error(비게이팅 · 상류 advisory 신호만)라 의도적으로 needs 에서 제외한다.
    needs: [typecheck-workers, selftest, wheel-selfcontained, typecheck-python, mgb-benchmark]
    if: always()  # 선행 job 이 실패/취소돼도 이 job 은 돌아 결과를 명시적으로 판정한다
    runs-on: ubuntu-latest
    steps:
      - name: Assert all gating jobs succeeded (정확일치 · fail-closed)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - "$RESULTS" <<'PY'
          import json, sys
          results = json.loads(sys.argv[1])
          # 게이팅 job 전수 — 이 목록은 위 needs 와 반드시 동일해야 한다.
          gating = ["typecheck-workers", "selftest", "wheel-selfcontained", "typecheck-python", "mgb-benchmark"]
          bad = []
          for job in gating:
              res = results.get(job, {}).get("result")
              if res != "success":  # skipped/cancelled/failure 전부 실패 — 정확일치
                  bad.append("%s=%s" % (job, res))
          if bad:
              print("CI-GATE=BLOCK — 게이팅 job 미통과:", ", ".join(bad))
              sys.exit(1)
          print("CI-GATE=GO — 게이팅 job 전부 success (%d개)" % len(gating))
          PY
