<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bmint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" rx="20" fill="url(#bbg)"/>

  <!-- 좌: 로고 미니어처 -->
  <g transform="translate(88,62)">
    <rect width="176" height="176" rx="36" fill="#0B1220" stroke="#334155" stroke-width="2.5"/>
    <g stroke="#475569" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="30" y1="52" x2="70" y2="52"/>
      <line x1="30" y1="76" x2="62" y2="76"/>
      <line x1="30" y1="100" x2="70" y2="100"/>
    </g>
    <line x1="30" y1="128" x2="76" y2="128" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
    <g stroke="#60A5FA" stroke-width="3.5" opacity="0.9">
      <line x1="112" y1="52" x2="140" y2="82"/>
      <line x1="140" y1="82" x2="110" y2="108"/>
      <line x1="140" y1="82" x2="144" y2="126"/>
      <line x1="110" y1="108" x2="144" y2="126"/>
    </g>
    <circle cx="112" cy="52" r="9" fill="#60A5FA"/>
    <circle cx="140" cy="82" r="12" fill="url(#bmint)"/>
    <circle cx="110" cy="108" r="8.5" fill="#FBBF24"/>
    <circle cx="144" cy="126" r="9" fill="#60A5FA"/>
  </g>

  <!-- 우: 워드마크 + 태그라인 -->
  <text x="320" y="128" fill="#F1F5F9" font-size="64" font-weight="800">빙구팩 <tspan fill="#34D399">BingguPack</tspan></text>
  <text x="322" y="180" fill="#CBD5E1" font-size="26">AI와 일하며 쌓이는 내 판단·실수·취향을 — 내 PC 안의 기억 장부로</text>
  <g font-size="19" font-weight="600">
    <rect x="322" y="208" width="150" height="40" rx="20" fill="#064E3B"/>
    <text x="397" y="234" text-anchor="middle" fill="#34D399">자동 저장 없음</text>
    <rect x="486" y="208" width="186" height="40" rx="20" fill="#1E3A5F"/>
    <text x="579" y="234" text-anchor="middle" fill="#93C5FD">내가 승인한 것만</text>
    <rect x="686" y="208" width="140" height="40" rx="20" fill="#3F2D12"/>
    <text x="756" y="234" text-anchor="middle" fill="#FCD34D">로컬 우선</text>
  </g>
</svg>
