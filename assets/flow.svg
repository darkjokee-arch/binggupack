<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="fwA" cx="0.1" cy="0" r="0.9">
      <stop offset="0" stop-color="#233060" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#233060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fwB" cx="1" cy="1" r="0.9">
      <stop offset="0" stop-color="#0E4E3C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0E4E3C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fwCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A47"/>
      <stop offset="1" stop-color="#141F38"/>
    </linearGradient>
    <linearGradient id="fwLedger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F5F49"/>
      <stop offset="1" stop-color="#0B4534"/>
    </linearGradient>
    <linearGradient id="fwMint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="fwShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="fwGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="fwAr" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#5C6B8C"/>
    </marker>
    <marker id="fwArM" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 0 0.8 L 9 5 L 0 9.2 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="960" height="320" rx="18" fill="#0B1220"/>
  <rect width="960" height="320" rx="18" fill="url(#fwA)"/>
  <rect width="960" height="320" rx="18" fill="url(#fwB)"/>
  <rect x="1.5" y="1.5" width="957" height="317" rx="16.5" fill="none" stroke="#26324D" stroke-width="3"/>

  <!-- ① 대화 -->
  <g filter="url(#fwShadow)">
    <rect x="30" y="112" width="172" height="96" rx="16" fill="url(#fwCard)"/>
    <rect x="31.5" y="113.5" width="169" height="93" rx="14.5" fill="none" stroke="#3A4A6E" stroke-width="1.6"/>
    <line x1="48" y1="114.8" x2="184" y2="114.8" stroke="#5A6C96" stroke-width="1.4" opacity="0.55"/>
  </g>
  <circle cx="52" cy="134" r="11" fill="#233258" stroke="#4E63A0" stroke-width="1.4"/>
  <text x="52" y="139" text-anchor="middle" fill="#A5C4FC" font-size="13" font-weight="700">1</text>
  <!-- 말풍선 아이콘 -->
  <g transform="translate(96,128)" stroke="#8FA8DB" stroke-width="2.6" fill="none" stroke-linejoin="round">
    <path d="M 0 4 Q 0 0 4 0 L 20 0 Q 24 0 24 4 L 24 12 Q 24 16 20 16 L 9 16 L 3 21 L 4.5 16 Q 0 16 0 12 Z"/>
  </g>
  <text x="116" y="182" text-anchor="middle" fill="#E7EDF7" font-size="17" font-weight="700">AI와 평소처럼 대화</text>

  <line x1="202" y1="160" x2="248" y2="160" stroke="#5C6B8C" stroke-width="2.6" marker-end="url(#fwAr)"/>

  <!-- ② 미리보기 -->
  <g filter="url(#fwShadow)">
    <rect x="252" y="112" width="184" height="96" rx="16" fill="url(#fwCard)"/>
    <rect x="253.5" y="113.5" width="181" height="93" rx="14.5" fill="none" stroke="#3A4A6E" stroke-width="1.6"/>
    <line x1="270" y1="114.8" x2="418" y2="114.8" stroke="#5A6C96" stroke-width="1.4" opacity="0.55"/>
  </g>
  <circle cx="274" cy="134" r="11" fill="#233258" stroke="#4E63A0" stroke-width="1.4"/>
  <text x="274" y="139" text-anchor="middle" fill="#A5C4FC" font-size="13" font-weight="700">2</text>
  <!-- 눈 아이콘 -->
  <g transform="translate(324,130)" stroke="#8FA8DB" stroke-width="2.6" fill="none">
    <path d="M 0 7 Q 12 -4 24 7 Q 12 18 0 7 Z" stroke-linejoin="round"/>
    <circle cx="12" cy="7" r="3.4"/>
  </g>
  <text x="344" y="182" text-anchor="middle" fill="#E7EDF7" font-size="17" font-weight="700">저장 후보 미리보기</text>

  <!-- 승인 안 하면 저장 0 -->
  <path d="M 344 112 L 344 78" stroke="#5C6B8C" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#fwAr)"/>
  <rect x="272" y="36" width="144" height="38" rx="19" fill="#101A30" stroke="#3A4A6E" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="344" y="61" text-anchor="middle" fill="#8CA0C0" font-size="14.5">승인 안 하면 저장 0</text>

  <!-- SAVE 승인 게이트 -->
  <line x1="436" y1="160" x2="520" y2="160" stroke="url(#fwMint)" stroke-width="3.2" marker-end="url(#fwArM)" filter="url(#fwGlow)"/>
  <path d="M 442 140 L 447 145.5 L 456 134.5" stroke="#5EEAD4" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="462" y="146" fill="#5EEAD4" font-size="12" font-weight="800">SAVE 승인</text>

  <!-- ③ 내 PC 기억 장부 -->
  <g filter="url(#fwShadow)">
    <rect x="524" y="102" width="200" height="116" rx="20" fill="url(#fwLedger)"/>
    <rect x="526" y="104" width="196" height="112" rx="18" fill="none" stroke="#34D399" stroke-width="2.4"/>
    <line x1="546" y1="105.6" x2="702" y2="105.6" stroke="#7BE8C5" stroke-width="1.4" opacity="0.5"/>
  </g>
  <circle cx="548" cy="126" r="11" fill="#0A3B2C" stroke="#34D399" stroke-width="1.6"/>
  <text x="548" y="131" text-anchor="middle" fill="#5EEAD4" font-size="13" font-weight="700">3</text>
  <!-- 장부 아이콘 -->
  <g transform="translate(610,120)" stroke="#A7F3D0" stroke-width="2.6" fill="none" stroke-linecap="round">
    <rect x="0" y="0" width="26" height="20" rx="3" stroke-linejoin="round"/>
    <line x1="6" y1="6" x2="20" y2="6"/>
    <line x1="6" y1="11" x2="16" y2="11"/>
    <line x1="6" y1="15.5" x2="20" y2="15.5" stroke="#5EEAD4"/>
  </g>
  <text x="624" y="172" text-anchor="middle" fill="#ECFDF5" font-size="18.5" font-weight="800">내 PC 기억 장부</text>
  <text x="624" y="198" text-anchor="middle" fill="#7BE8C5" font-size="13.5">로컬 우선 · 승인분만 · ledger.sqlite</text>

  <!-- 갈래 -->
  <path d="M 724 132 C 748 122 752 98 766 88" stroke="#5C6B8C" stroke-width="2.6" fill="none" marker-end="url(#fwAr)"/>
  <path d="M 724 188 C 748 198 752 222 766 232" stroke="#5C6B8C" stroke-width="2.6" fill="none" marker-end="url(#fwAr)"/>

  <!-- 자동 회상 -->
  <g filter="url(#fwShadow)">
    <rect x="770" y="48" width="172" height="78" rx="16" fill="url(#fwCard)"/>
    <rect x="771.5" y="49.5" width="169" height="75" rx="14.5" fill="none" stroke="#41539E" stroke-width="1.6"/>
  </g>
  <!-- 돋보기 아이콘 -->
  <g transform="translate(788,72)" stroke="#A5C4FC" stroke-width="2.6" fill="none">
    <circle cx="8" cy="8" r="7"/>
    <line x1="13.5" y1="13.5" x2="20" y2="20" stroke-linecap="round"/>
  </g>
  <text x="856" y="82" text-anchor="middle" fill="#DCE7FB" font-size="16.5" font-weight="700">다음 작업 때</text>
  <text x="856" y="106" text-anchor="middle" fill="#DCE7FB" font-size="16.5" font-weight="700">자동 회상</text>

  <!-- 그래프 → 팩 -->
  <g filter="url(#fwShadow)">
    <rect x="770" y="194" width="172" height="78" rx="16" fill="url(#fwCard)"/>
    <rect x="771.5" y="195.5" width="169" height="75" rx="14.5" fill="none" stroke="#8A6D1F" stroke-width="1.6"/>
  </g>
  <!-- 그래프 아이콘 -->
  <g transform="translate(786,216)">
    <line x1="4" y1="4" x2="16" y2="12" stroke="#FCD34D" stroke-width="2.2"/>
    <line x1="16" y1="12" x2="6" y2="21" stroke="#FCD34D" stroke-width="2.2"/>
    <circle cx="4" cy="4" r="3.4" fill="#FCD34D"/>
    <circle cx="16" cy="12" r="4.2" fill="#FBBF24"/>
    <circle cx="6" cy="21" r="3.2" fill="#FCD34D"/>
  </g>
  <text x="856" y="228" text-anchor="middle" fill="#FBE9B4" font-size="16.5" font-weight="700">지식 그래프</text>
  <text x="856" y="252" text-anchor="middle" fill="#FBE9B4" font-size="16.5" font-weight="700">→ 전문가 팩 자동 생성</text>
</svg>
