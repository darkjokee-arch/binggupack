<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <defs>
    <radialGradient id="chA" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#233060" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#233060" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="chB" cx="0.85" cy="1" r="0.8">
