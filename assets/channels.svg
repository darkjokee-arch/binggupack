  <text x="802" y="70" text-anchor="middle" fill="#FBDCE9" font-size="17" font-weight="800">웹 · 앱 커넥터</text>
  <text x="802" y="99" text-anchor="middle" fill="#C69BAE" font-size="13.5">경로 토큰 보호 터널 (HTTP 모드)</text>

