    <rect x="358" y="194" width="244" height="88" rx="18" fill="none" stroke="#34D399" stroke-width="2.4"/>
    <line x1="378" y1="195.6" x2="582" y2="195.6" stroke="#7BE8C5" stroke-width="1.4" opacity="0.5"/>
