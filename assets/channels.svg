  <rect x="290" y="300" width="380" height="38" rx="19" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="325" text-anchor="middle" fill="#94A3B8" font-size="15">어느 채널이든 — 내가 승인한 것만 · 로컬 우선</text>
