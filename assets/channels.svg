  <line x1="606" y1="238" x2="692" y2="238" stroke="url(#chMint)" stroke-width="3.2" marker-end="url(#chArM)"/>
  <text x="646" y="216" text-anchor="middle" fill="#7BE8C5" font-size="11.5">민감정보 T3 차단</text>
  <text x="646" y="264" text-anchor="middle" fill="#7BE8C5" font-size="11.5">바뀐 것만 델타</text>

  <g filter="url(#chShadow)">
