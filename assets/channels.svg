  <text x="758" y="230" fill="#FBE9B4" font-size="17" font-weight="800">오픈크랩 전문가 팩</text>
  <text x="822" y="258" text-anchor="middle" fill="#C4A860" font-size="13.5">읽기 조회 cloud_recall · cloud_packs</text>

