  </g>
  <path d="M 292 339 L 297.5 345 L 308 333" stroke="#5EEAD4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="492" y="345" text-anchor="middle" fill="#B7C3D8" font-size="15.5" font-weight="600">어느 채널이든 — 내가 승인한 것만 · 로컬 우선</text>
