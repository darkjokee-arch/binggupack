  <text x="496" y="230" text-anchor="middle" fill="#ECFDF5" font-size="19" font-weight="800">내 PC 장부</text>
  <text x="496" y="258" text-anchor="middle" fill="#7BE8C5" font-size="13.5">ledger.sqlite · 자동 저장 없음</text>

